[project]
name = "gsw-eval"
version = "0.1.0"
description = "Benchmark for large language models on written Swiss German"
requires-python = ">=3.11"
dependencies = [
    "sacrebleu>=2.4",
    "transformers>=4.45",
    "tokenizers>=0.20",
    "tiktoken>=0.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
gsw-eval = "gsw_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsw_eval"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
